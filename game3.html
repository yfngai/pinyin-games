<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>拼音小高手 - 四聲接水果大冒險</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .game-card {
      background: #ffffff;
      width: 100%;
      max-width: 680px;
      border-radius: 24px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #f8fafc;
      border-bottom: 2px solid #e2e8f0;
      flex-wrap: wrap;
      gap: 6px;
    }

    .stat-box {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #334155;
    }

    .stat-value {
      font-size: 1.15rem;
      color: #ea580c;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: #e2e8f0;
      border: none;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      color: #334155;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s, transform 0.1s;
    }

    .icon-btn:hover {
      background: #cbd5e1;
      transform: scale(1.03);
    }

    .home-btn-head {
      background: #fef08a;
      color: #854d0e;
      border: 1px solid #fde047;
    }

    .home-btn-head:hover {
      background: #fde047;
    }

    .question-banner {
      background: linear-gradient(90deg, #166534 0%, #15803d 100%);
      color: #ffffff;
      padding: 12px 16px;
      text-align: center;
      box-shadow: inset 0 -4px 8px rgba(0, 0, 0, 0.2);
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .question-hint {
      font-size: 0.88rem;
      color: #fde047;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .question-text {
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.3;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .audio-btn {
      background: #22c55e;
      color: #052e16;
      border: none;
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(34, 197, 94, 0.4);
      transition: transform 0.1s, background-color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .audio-btn:hover {
      background: #4ade80;
      transform: scale(1.05);
    }

    .canvas-container {
      position: relative;
      width: 100%;
      background: #7dd3fc;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: pointer;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 24px 20px;
      text-align: center;
      z-index: 10;
      overflow-y: auto;
    }

    .overlay.hidden {
      display: none;
    }

    .user-inputs-top {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 14px;
      width: 100%;
    }

    .user-inputs-top input {
      width: 100px;
      padding: 6px 10px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: bold;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
      user-select: auto;
      -webkit-user-select: auto;
    }

    .user-inputs-top input:focus {
      border-color: #16a34a;
    }

    .overlay h1 {
      font-size: 1.5rem;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .overlay p {
      font-size: 0.9rem;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 14px;
      max-width: 500px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      justify-content: center;
      width: 100%;
      flex-wrap: wrap;
    }

    .btn {
      background: #16a34a;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.35);
      transition: transform 0.15s ease, background-color 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-secondary {
      background: #0284c7;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
    }

    .btn-secondary:hover {
      background: #0369a1;
    }

    .btn-menu {
      background: #eab308;
      color: #713f12;
      box-shadow: 0 4px 12px rgba(234, 179, 8, 0.35);
    }

    .btn-menu:hover {
      background: #ca8a04;
      color: #ffffff;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .final-score {
      font-size: 2.6rem;
      font-weight: 900;
      color: #16a34a;
      margin: 4px 0;
    }

    .leaderboard-container {
      width: 100%;
      max-width: 420px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 10px;
      margin-top: 8px;
    }

    .leaderboard-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 5px 6px;
      text-align: center;
      border-bottom: 1px solid #e2e8f0;
    }

    .leaderboard-table th {
      background: #e2e8f0;
      color: #334155;
      font-weight: 700;
    }

    .leaderboard-table tr:nth-child(1) td { color: #d97706; font-weight: 800; }
    .leaderboard-table tr:nth-child(2) td { color: #475569; font-weight: 800; }
    .leaderboard-table tr:nth-child(3) td { color: #b45309; font-weight: 800; }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="header">
      <div class="stat-box">⏳ <span id="time-display" class="stat-value">1:00</span></div>
      <div class="stat-box">🏆 <span id="score-display" class="stat-value">0</span></div>
      <div class="header-actions">
        <button id="mute-btn" class="icon-btn">🔊 音效：開</button>
        <a href="index.html" class="icon-btn home-btn-head" title="返回主頁面">🏠 主選單</a>
      </div>
    </div>

    <div class="question-banner">
      <div id="question-hint" class="question-hint">🧺 移動水果籃，接住對應聲調的水果！</div>
      <div id="question-text" class="question-text">載入中...</div>
      <button id="play-audio-btn" class="audio-btn">🔊 點擊重播目標聲調讀音</button>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="600" height="480"></canvas>

      <div id="start-screen" class="overlay">
        <div class="user-inputs-top">
          <input type="text" id="input-class" placeholder="班別 (如2A)" maxlength="10">
          <input type="text" id="input-id" placeholder="學號 (如01)" maxlength="10">
        </div>

        <h1>🍎 四聲接水果大冒險 🧺</h1>
        <p><b>二年級漢語拼音專題練習 (第一聲 ¯ / 第二聲 ˊ / 第三聲 ˇ / 第四聲 ˋ)</b><br><br>
        <b>玩法說明：</b><br>
        聽題目要求的聲調（如：陰平/第一聲），左右移動水果籃接住對應聲調的水果！<br>
        🍎 <b>接對水果加 10 分，接錯扣 5 分！</b><br>
        <b>總限時 60 秒</b>，輸入班別學號後即可開始！</p>

        <div class="btn-group">
          <button id="start-btn" class="btn">開始挑戰 (60秒)</button>
          <a href="index.html" class="btn btn-menu">🏠 返回主選單</a>
        </div>
      </div>

      <div id="end-screen" class="overlay hidden" style="justify-content: center;">
        <h1>⏰ 60 秒時間到！</h1>
        <p id="player-info-display" style="font-weight: bold; color: #0284c7; margin-bottom: 0;"></p>
        <div id="final-score" class="final-score">0</div>
        <p id="eval-text" style="font-weight: bold; margin-bottom: 6px;"></p>
        
        <div class="leaderboard-container">
          <div class="leaderboard-title">🏆 班級最高分龍虎榜 (Top 5)</div>
          <table class="leaderboard-table">
            <thead>
              <tr>
                <th>名次</th>
                <th>班別</th>
                <th>學號</th>
                <th>最高分</th>
              </tr>
            </thead>
            <tbody id="leaderboard-body">
            </tbody>
          </table>
        </div>

        <div class="btn-group">
          <button id="restart-btn" class="btn">再次挑戰</button>
          <button id="switch-player-btn" class="btn btn-secondary">換人遊玩</button>
          <a href="index.html" class="btn btn-menu">🏠 返回主選單</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 四聲調定義
    const TONES = [
      { id: 1, name: "第一聲 (陰平)", mark: "¯", speechPrompt: "第一聲陰平" },
      { id: 2, name: "第二聲 (陽平)", mark: "ˊ", speechPrompt: "第二聲陽平" },
      { id: 3, name: "第三聲 (上聲)", mark: "ˇ", speechPrompt: "第三聲上聲" },
      { id: 4, name: "第四聲 (去聲)", mark: "ˋ", speechPrompt: "第四聲去聲" }
    ];

    // 水果詞庫
    const FRUIT_WORDS = [
      // tone 1
      { c: "媽", p: "mā", tone: 1, icon: "🍎" }, { c: "八", p: "bā", tone: 1, icon: "🍓" },
      { c: "包", p: "bāo", tone: 1, icon: "🍌" }, { c: "飛", p: "fēi", tone: 1, icon: "🍊" },
      { c: "高", p: "gāo", tone: 1, icon: "🍉" }, { c: "花", p: "huā", tone: 1, icon: "🍇" },

      // tone 2
      { c: "麻", p: "má", tone: 2, icon: "🍎" }, { c: "白", p: "bái", tone: 2, icon: "🍓" },
      { c: "房", p: "fáng", tone: 2, icon: "🍌" }, { c: "國", p: "guó", tone: 2, icon: "🍊" },
      { c: "紅", p: "hóng", tone: 2, icon: "🍉" }, { c: "來", p: "lái", tone: 2, icon: "🍇" },

      // tone 3
      { c: "馬", p: "mǎ", tone: 3, icon: "🍎" }, { c: "百", p: "bǎi", tone: 3, icon: "🍓" },
      { c: "筆", p: "bǐ", tone: 3, icon: "🍌" }, { c: "好", p: "hǎo", tone: 3, icon: "🍊" },
      { c: "狗", p: "gǒu", tone: 3, icon: "🍉" }, { c: "手", p: "shǒu", tone: 3, icon: "🍇" },

      // tone 4
      { c: "罵", p: "mà", tone: 4, icon: "🍎" }, { c: "爸", p: "bà", tone: 4, icon: "🍓" },
      { c: "大", p: "dà", tone: 4, icon: "🍌" }, { c: "放", p: "fàng", tone: 4, icon: "🍊" },
      { c: "過", p: "guò", tone: 4, icon: "🍉" }, { c: "看", p: "kàn", tone: 4, icon: "🍇" }
    ];

    let audioCtx = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (isMuted) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.2);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'gameover') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.5);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      }
    }

    function playToneSpeech(toneObj) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(`請接住${toneObj.speechPrompt}的水果`);
        msg.lang = 'zh-TW';
        msg.volume = 1.0;
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
      }
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const timeDisplay = document.getElementById('time-display');
    const scoreDisplay = document.getElementById('score-display');
    const questionText = document.getElementById('question-text');
    const questionHint = document.getElementById('question-hint');
    const playAudioBtn = document.getElementById('play-audio-btn');
    const startScreen = document.getElementById('start-screen');
    const endScreen = document.getElementById('end-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const switchPlayerBtn = document.getElementById('switch-player-btn');
    const muteBtn = document.getElementById('mute-btn');
    const finalScoreDisplay = document.getElementById('final-score');
    const evalTextDisplay = document.getElementById('eval-text');
    const inputClass = document.getElementById('input-class');
    const inputId = document.getElementById('input-id');
    const playerInfoDisplay = document.getElementById('player-info-display');
    const leaderboardBody = document.getElementById('leaderboard-body');

    let gameState = 'START';
    let score = 0;
    let timeLeft = 60;
    let lastTime = 0;
    let currentTargetTone = TONES[0];
    let currentStudent = { className: '', studentId: '' };

    // 籃子物件
    const basket = {
      x: 300,
      y: 420,
      width: 100,
      height: 40,
      speed: 450
    };

    let fruits = [];
    let floatTexts = [];
    let spawnTimer = 0;
    let isTouchMove = false;

    class Fruit {
      constructor(wordObj) {
        this.x = 40 + Math.random() * (canvas.width - 80);
        this.y = -30;
        this.wordObj = wordObj;
        this.speed = 130 + Math.random() * 70;
        this.radius = 26;
      }

      update(dt) {
        this.y += this.speed * dt;
      }

      draw() {
        ctx.save();
        // 畫水果氣泡底層
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 畫水果圖標與文字
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 18px "Microsoft JhengHei", sans-serif';
        ctx.fillText(this.wordObj.c, this.x - 8, this.y - 2);

        ctx.fillStyle = '#ea580c';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText(this.wordObj.p, this.x + 12, this.y - 2);

        ctx.restore();
      }
    }

    function setTargetTone() {
      currentTargetTone = TONES[Math.floor(Math.random() * TONES.length)];
      questionHint.innerHTML = "🧺 移動水果籃，接住對應聲調的水果！";
      questionText.innerHTML = `當前目標聲調：<span style="color:#fde047; font-size:1.6rem;">${currentTargetTone.name}</span>`;
      playToneSpeech(currentTargetTone);
    }

    playAudioBtn.addEventListener('click', () => {
      playToneSpeech(currentTargetTone);
    });

    function spawnFruit() {
      let chosenWord;
      if (Math.random() < 0.45) {
        const correctWords = FRUIT_WORDS.filter(w => w.tone === currentTargetTone.id);
        chosenWord = correctWords[Math.floor(Math.random() * correctWords.length)];
      } else {
        const wrongWords = FRUIT_WORDS.filter(w => w.tone !== currentTargetTone.id);
        chosenWord = wrongWords[Math.floor(Math.random() * wrongWords.length)];
      }

      fruits.push(new Fruit(chosenWord));
    }

    // 控制籃子位置 (Mouse / Touch)
    function handlePointerMove(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const x = (clientX - rect.left) * scaleX;
      basket.x = Math.max(basket.width / 2, Math.min(canvas.width - basket.width / 2, x));
    }

    canvas.addEventListener('mousemove', (e) => {
      if (gameState === 'PLAYING') handlePointerMove(e.clientX);
    });

    canvas.addEventListener('touchmove', (e) => {
      if (gameState === 'PLAYING' && e.touches.length > 0) {
        e.preventDefault();
        handlePointerMove(e.touches[0].clientX);
      }
    }, { passive: false });

    function addFloatText(text, x, y, color) {
      floatTexts.push({ text, x, y, color, alpha: 1.0, life: 40 });
    }

    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      muteBtn.textContent = isMuted ? '🔇 音效：關' : '🔊 音效：開';
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    switchPlayerBtn.addEventListener('click', () => {
      endScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
      inputClass.value = '';
      inputId.value = '';
      inputClass.focus();
    });

    function startGame() {
      const className = inputClass.value.trim();
      const studentId = inputId.value.trim();

      if (!className || !studentId) {
        alert('請先輸入「班別」與「學號」再開始挑戰喔！');
        return;
      }

      currentStudent = { className, studentId };
      initAudio();

      score = 0;
      timeLeft = 60;
      fruits = [];
      floatTexts = [];
      spawnTimer = 0;

      scoreDisplay.textContent = score;
      timeDisplay.textContent = formatTime(timeLeft);

      setTargetTone();

      startScreen.classList.add('hidden');
      endScreen.classList.add('hidden');
      gameState = 'PLAYING';

      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    function updateLeaderboard(className, studentId, finalScore) {
      let scores = [];
      try {
        scores = JSON.parse(localStorage.getItem('pinyin_fruit_leaderboard') || '[]');
      } catch (e) {
        scores = [];
      }

      const key = `${className}_${studentId}`;
      const existingIdx = scores.findIndex(item => item.key === key);

      if (existingIdx !== -1) {
        scores[existingIdx].score = Math.max(scores[existingIdx].score, finalScore);
      } else {
        scores.push({ key, className, studentId, score: finalScore });
      }

      scores.sort((a, b) => b.score - a.score);
      localStorage.setItem('pinyin_fruit_leaderboard', JSON.stringify(scores));

      leaderboardBody.innerHTML = '';
      const top5 = scores.slice(0, 5);
      
      top5.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${item.className}</td>
          <td>${item.studentId}</td>
          <td>${item.score}</td>
        `;
        leaderboardBody.appendChild(tr);
      });
    }

    function endGame() {
      gameState = 'GAMEOVER';
      playSound('gameover');
      finalScoreDisplay.textContent = score;
      playerInfoDisplay.textContent = `玩家：${currentStudent.className} 班 ${currentStudent.studentId} 號`;

      if (score >= 100) {
        evalTextDisplay.textContent = '🌟 太神了！四聲調分辨得一清二楚！四聲大師！';
      } else if (score >= 70) {
        evalTextDisplay.textContent = '👍 非常棒！聽力與聲調敏銳度都很棒！';
      } else if (score >= 40) {
        evalTextDisplay.textContent = '👏 表現不錯！多練習聲調變化會更厲害！';
      } else {
        evalTextDisplay.textContent = '💪 多聽多玩，下次一定能拿更高分！';
      }

      updateLeaderboard(currentStudent.className, currentStudent.studentId, score);
      endScreen.classList.remove('hidden');
    }

    function gameLoop(now) {
      if (gameState !== 'PLAYING') return;

      const dt = (now - lastTime) / 1000;
      lastTime = now;

      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        timeDisplay.textContent = "0:00";
        endGame();
        return;
      }
      timeDisplay.textContent = formatTime(Math.ceil(timeLeft));

      spawnTimer += dt;
      if (spawnTimer >= 0.9) {
        spawnTimer = 0;
        if (fruits.length < 5) {
          spawnFruit();
        }
      }

      // 更新水果與碰撞檢測
      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        f.update(dt);

        // 檢測是否落入籃子
        if (
          f.y + f.radius >= basket.y &&
          f.y - f.radius <= basket.y + basket.height &&
          f.x >= basket.x - basket.width / 2 &&
          f.x <= basket.x + basket.width / 2
        ) {
          if (f.wordObj.tone === currentTargetTone.id) {
            score += 10;
            playSound('hit');
            addFloatText('接對 +10分！', f.x, basket.y - 20, '#16a34a');
          } else {
            score = Math.max(0, score - 5);
            playSound('wrong');
            addFloatText('接錯 -5分！', f.x, basket.y - 20, '#ef4444');
          }
          scoreDisplay.textContent = score;
          fruits.splice(i, 1);
          continue;
        }

        // 水果落到底部消失
        if (f.y - f.radius > canvas.height) {
          fruits.splice(i, 1);
        }
      }

      render();
      requestAnimationFrame(gameLoop);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 背景 (藍天與草地)
      ctx.fillStyle = '#7dd3fc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(60, 60, 35, 0, Math.PI * 2);
      ctx.fill();

      // 草地
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(0, 440, canvas.width, 40);

      // 繪製水果籃
      ctx.save();
      ctx.fillStyle = '#b45309';
      ctx.strokeStyle = '#78350f';
      ctx.lineWidth = 4;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(basket.x - basket.width / 2, basket.y, basket.width, basket.height, 10);
      } else {
        ctx.rect(basket.x - basket.width / 2, basket.y, basket.width, basket.height);
      }
      ctx.fill();
      ctx.stroke();

      // 籃子編織紋理線條
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(basket.x - basket.width / 2 + 15, basket.y);
      ctx.lineTo(basket.x - basket.width / 2 + 15, basket.y + basket.height);
      ctx.moveTo(basket.x, basket.y);
      ctx.lineTo(basket.x, basket.y + basket.height);
      ctx.moveTo(basket.x + basket.width / 2 - 15, basket.y);
      ctx.lineTo(basket.x + basket.width / 2 - 15, basket.y + basket.height);
      ctx.stroke();
      ctx.restore();

      // 繪製水果
      fruits.forEach(f => f.draw());

      // 繪製漂浮得分文字
      for (let i = floatTexts.length - 1; i >= 0; i--) {
        const ft = floatTexts[i];
        ctx.save();
        ctx.globalAlpha = ft.alpha;
        ctx.font = '900 22px sans-serif';
        ctx.fillStyle = ft.color;
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();

        ft.y -= 1.2;
        ft.alpha -= 0.025;
        ft.life--;
        if (ft.life <= 0) floatTexts.splice(i, 1);
      }
    }

    render();
  </script>
</body>
</html>
