<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拼音小高手 - 樂趣學習主選單</title>
  <style>
    :root {
      --primary-color: #ff6b6b;
      --secondary-color: #4ecdc4;
      --yellow-accent: #ffe66d;
      --purple-accent: #a29bfe;
      --dark-text: #2d3436;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #70a1ff 0%, #a8c0ff 60%, #e0c3fc 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* 裝飾性漂浮雲朵 */
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50px;
      z-index: 1;
      animation: floatCloud linear infinite;
    }

    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
    }

    .cloud1 {
      width: 120px;
      height: 40px;
      top: 40px;
      left: -140px;
      animation-duration: 25s;
    }
    .cloud1::before { width: 50px; height: 50px; top: -20px; left: 20px; }
    .cloud1::after { width: 40px; height: 40px; top: -15px; left: 55px; }

    .cloud2 {
      width: 160px;
      height: 50px;
      top: 120px;
      left: -180px;
      animation-duration: 35s;
      animation-delay: 5s;
    }
    .cloud2::before { width: 60px; height: 60px; top: -25px; left: 30px; }
    .cloud2::after { width: 50px; height: 50px; top: -20px; left: 80px; }

    @keyframes floatCloud {
      from { transform: translateX(-200px); }
      to { transform: translateX(calc(100vw + 200px)); }
    }

    /* 頂部功能列 */
    .header-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .user-pill {
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #ffbe76;
      padding: 8px 18px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      color: var(--dark-text);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      font-size: 1.05rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .user-pill:hover {
      transform: scale(1.04);
    }

    .user-avatar {
      font-size: 1.4rem;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      background: #ffffff;
      border: 3px solid #30336b;
      padding: 8px 16px;
      border-radius: 25px;
      font-weight: 800;
      font-size: 0.95rem;
      color: #30336b;
      cursor: pointer;
      box-shadow: 0 5px 0 #30336b;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #30336b;
    }

    .action-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #30336b;
    }

    /* 標題區域 */
    .title-container {
      text-align: center;
      z-index: 10;
      margin-bottom: 20px;
      position: relative;
    }

    .main-title {
      font-size: 3rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 4px 4px 0px #222f3e, -2px -2px 0 #222f3e, 2px -2px 0 #222f3e, -2px 2px 0 #222f3e, 0 8px 15px rgba(0,0,0,0.25);
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .sub-title {
      background: var(--yellow-accent);
      color: #d35400;
      display: inline-block;
      padding: 4px 18px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 1.15rem;
      margin-top: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border: 2px solid #f39c12;
    }

    /* 吉祥物與對話框 */
    .mascot-section {
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 24px;
      cursor: pointer;
    }

    .speech-bubble {
      background: #ffffff;
      border: 3px solid #222f3e;
      border-radius: 20px;
      padding: 10px 18px;
      font-weight: 800;
      color: #2c3e50;
      position: relative;
      box-shadow: 0 6px 12px rgba(0,0,0,0.12);
      font-size: 1rem;
      max-width: 260px;
      animation: pulseBubble 2s infinite ease-in-out;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      right: -14px;
      top: 50%;
      transform: translateY(-50%);
      border-width: 8px 0 8px 14px;
      border-style: solid;
      border-color: transparent transparent transparent #222f3e;
    }

    @keyframes pulseBubble {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .mole-mascot {
      width: 75px;
      height: 75px;
      animation: bounceMascot 2.5s infinite ease-in-out;
    }

    @keyframes bounceMascot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* 遊戲卡片網格 */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 960px;
      z-index: 10;
      margin-bottom: 24px;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 28px;
      border: 4px solid #222f3e;
      box-shadow: 0 12px 0 #222f3e;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: all 0.2s ease;
      overflow: hidden;
    }

    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 0 #222f3e;
    }

    .card-tag {
      position: absolute;
      top: 12px;
      right: -32px;
      background: #ff4757;
      color: white;
      font-weight: 900;
      font-size: 0.75rem;
      padding: 4px 35px;
      transform: rotate(30deg);
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .card-icon-wrapper {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      font-size: 3rem;
      border: 3px solid #222f3e;
      box-shadow: inset 0 -5px 10px rgba(0,0,0,0.1);
    }

    .card-1 .card-icon-wrapper { background: #ff7675; }
    .card-2 .card-icon-wrapper { background: #74b9ff; }
    .card-3 .card-icon-wrapper { background: #55efc4; }

    .game-title {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--dark-text);
      margin-bottom: 6px;
    }

    .game-desc {
      font-size: 0.88rem;
      color: #636e72;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 16px;
      min-height: 38px;
    }

    .play-btn {
      width: 100%;
      padding: 12px 0;
      border-radius: 20px;
      border: 3px solid #222f3e;
      font-size: 1.1rem;
      font-weight: 900;
      color: white;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 5px 0 #222f3e;
      transition: all 0.15s;
    }

    .card-1 .play-btn { background: #ff4757; }
    .card-2 .play-btn { background: #0984e3; }
    .card-3 .play-btn { background: #00b894; }

    .play-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    .play-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #222f3e;
    }

    /* 簽到領獎小區域 */
    .daily-reward-bar {
      background: rgba(255, 255, 255, 0.92);
      border: 3px solid #222f3e;
      border-radius: 24px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
      box-shadow: 0 6px 0 #222f3e;
    }

    .reward-text {
      font-weight: 800;
      color: #2c3e50;
      font-size: 0.95rem;
    }

    .star-counter {
      color: #f39c12;
      font-size: 1.2rem;
      font-weight: 900;
    }

    .claim-btn {
      background: #ffe66d;
      border: 2px solid #222f3e;
      padding: 6px 14px;
      border-radius: 15px;
      font-weight: 900;
      color: #d35400;
      cursor: pointer;
      box-shadow: 0 3px 0 #222f3e;
    }

    .claim-btn:disabled {
      background: #dfe6e9;
      color: #b2bec3;
      border-color: #b2bec3;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* 通用 Modal 彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      border: 4px solid #222f3e;
      border-radius: 28px;
      padding: 24px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      position: relative;
      transform: scale(0.8);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.4rem;
      font-weight: 900;
      color: #222f3e;
    }

    .close-modal {
      background: #ff7675;
      color: white;
      border: 2px solid #222f3e;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #222f3e;
    }

    .modal-input {
      width: 100%;
      padding: 10px 14px;
      border: 3px solid #cbd5e1;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 12px;
      outline: none;
    }

    .modal-input:focus {
      border-color: #0984e3;
    }

    .modal-btn {
      width: 100%;
      padding: 12px;
      background: #2ed573;
      border: 3px solid #222f3e;
      color: white;
      font-size: 1.05rem;
      font-weight: 900;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 0 #222f3e;
    }

    /* 響應式調整 */
    @media (max-width: 768px) {
      .games-grid {
        grid-template-columns: 1fr;
        max-width: 360px;
      }
      .main-title {
        font-size: 2.2rem;
      }
      .mascot-section {
        flex-direction: column-reverse;
        gap: 6px;
      }
      .speech-bubble::after {
        right: 50%;
        top: 100%;
        transform: translateX(50%);
        border-width: 12px 12px 0 12px;
        border-color: #222f3e transparent transparent transparent;
      }
    }
  </style>
</head>
<body>

  <!-- 背景漂浮雲朵 -->
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <!-- 頂部資訊與設定列 -->
  <div class="header-bar">
    <div class="user-pill" onclick="openModal('profileModal')">
      <span class="user-avatar">👧</span>
      <span id="user-display-text">2A 班 01 號 (未設定)</span>
      <span style="font-size: 0.8rem; color: #7f8c8d;">✏️</span>
    </div>

    <div class="header-actions">
      <button class="action-btn" onclick="openModal('rankModal')">🏆 英雄榜</button>
    </div>
  </div>

  <!-- 標題區域 -->
  <div class="title-container">
    <div class="main-title">
      <span>✨</span>
      <span>拼音小高手</span>
      <span>⭐</span>
    </div>
    <div class="sub-title">二年級漢語拼音遊樂園 🎪</div>
  </div>

  <!-- 吉祥物互動區 -->
  <div class="mascot-section" onclick="mascotSpeak()">
    <div class="speech-bubble" id="mascot-speech">
      點擊我！今天想挑戰哪一個拼音遊戲呢？🔨
    </div>
    <svg class="mole-mascot" viewBox="0 0 100 100">
      <ellipse cx="50" cy="65" rx="32" ry="26" fill="#8d5524" />
      <ellipse cx="50" cy="40" rx="26" ry="24" fill="#a0522d" />
      <ellipse cx="50" cy="48" rx="16" ry="12" fill="#ffdbac" />
      <circle cx="50" cy="43" r="5" fill="#e74c3c" />
      <circle cx="42" cy="35" r="3" fill="#2c3e50" />
      <circle cx="58" cy="35" r="3" fill="#2c3e50" />
      <path d="M 44 53 Q 50 58 56 53" stroke="#2c3e50" stroke-width="2" fill="none" />
      <!-- 玩具錘子 -->
      <rect x="70" y="25" width="8" height="35" fill="#f39c12" rx="2" transform="rotate(20 70 25)" />
      <rect x="62" y="15" width="26" height="15" fill="#e74c3c" rx="4" transform="rotate(20 62 15)" />
    </svg>
  </div>

  <!-- 遊戲選擇網格 (三個專屬小二的拼音遊戲) -->
  <div class="games-grid">
    
    <!-- 遊戲 1：聲母打地鼠 -->
    <div class="game-card card-1">
      <div class="card-tag">最受歡迎</div>
      <div class="card-icon-wrapper">🔨</div>
      <h2 class="game-title">聲母打地鼠</h2>
      <p class="game-desc">考考你的反應！聽清題目，擊中正確聲母的地鼠！</p>
      <a href="game2.html" class="play-btn">立即開玩 ➔</a>
    </div>

    <!-- 遊戲 2：聲韻大投籃 -->
    <div class="game-card card-2">
      <div class="card-tag" style="background:#0984e3;">聽力特訓</div>
      <div class="card-icon-wrapper">🏀</div>
      <h2 class="game-title">聲韻大投籃</h2>
      <p class="game-desc">聽題目讀音，將帶有正確聲母或韻母的籃球投進籃框！</p>
      <a href="#" onclick="alert('「聲韻大投籃」遊戲正在進行關卡更新，請先體驗「聲母打地鼠」或「四聲接水果」！'); return false;" class="play-btn">準備開始 ➔</a>
    </div>

    <!-- 遊戲 3：四聲接水果 -->
    <div class="game-card card-3">
      <div class="card-tag" style="background:#00b894;">四聲考驗</div>
      <div class="card-icon-wrapper">🧺</div>
      <h2 class="game-title">四聲接水果</h2>
      <p class="game-desc">移動水果籃！接住陰平、陽平、上聲或去聲對應的水果！</p>
      <a href="game1.html" class="play-btn">立即開玩 ➔</a>
    </div>

  </div>

  <!-- 每日簽到領獎小列 -->
  <div class="daily-reward-bar">
    <span style="font-size: 1.5rem;">📅</span>
    <div class="reward-text">
      每日簽到獎勵：<span class="star-counter" id="star-count">⭐ 0</span>
    </div>
    <button class="claim-btn" id="claim-btn" onclick="claimStar()">簽到領星星</button>
  </div>

  <!-- Modal 1: 修改個人資料 -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">✏️ 設定學生資料</h3>
        <button class="close-modal" onclick="closeModal('profileModal')">✕</button>
      </div>
      <p style="font-size: 0.9rem; color: #636e72; margin-bottom: 12px;">請輸入你的班別與學號，得分會記錄在龍虎榜喔！</p>
      <input type="text" id="modal-class" class="modal-input" placeholder="班別 (例如: 2A)" maxlength="10">
      <input type="text" id="modal-id" class="modal-input" placeholder="學號 (例如: 01)" maxlength="10">
      <button class="modal-btn" onclick="saveProfile()">儲存資料</button>
    </div>
  </div>

  <!-- Modal 2: 英雄榜 modal -->
  <div class="modal-overlay" id="rankModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">🏆 班級最高分榜</h3>
        <button class="close-modal" onclick="closeModal('rankModal')">✕</button>
      </div>
      <div id="rank-content" style="max-height: 250px; overflow-y: auto; text-align: left; font-size: 0.95rem; font-weight: bold; color: #2d3436;">
        <!-- JS 動態生成 -->
      </div>
    </div>
  </div>

  <script>
    // 網頁載入初始化
    document.addEventListener('DOMContentLoaded', () => {
      loadProfile();
      checkDailyStar();
    });

    // 載入個人資料
    function loadProfile() {
      const savedClass = localStorage.getItem('pinyin_class') || '';
      const savedId = localStorage.getItem('pinyin_id') || '';
      
      const userDisplay = document.getElementById('user-display-text');
      if (savedClass && savedId) {
        userDisplay.textContent = `${savedClass} 班 ${savedId} 號`;
        document.getElementById('modal-class').value = savedClass;
        document.getElementById('modal-id').value = savedId;
      } else {
        userDisplay.textContent = `點此設定班別與學號`;
      }
    }

    // 儲存個人資料
    function saveProfile() {
      const c = document.getElementById('modal-class').value.trim();
      const id = document.getElementById('modal-id').value.trim();

      if (!c || !id) {
        alert('請填寫完整班別與學號喔！');
        return;
      }

      localStorage.setItem('pinyin_class', c);
      localStorage.setItem('pinyin_id', id);
      loadProfile();
      closeModal('profileModal');
      alert('資料儲存成功！祝你遊戲拿高分！🎉');
    }

    // 吉祥物點擊對話與發聲
    const speechLines = [
      "準備好挑戰聲母打地鼠了嗎？🔨",
      "記得分清四個聲調的符號喔！🍎",
      "加油！今天也要拿滿分！⭐",
      "我是地鼠小助手，陪你練習拼音！✨"
    ];

    function mascotSpeak() {
      const bubble = document.getElementById('mascot-speech');
      const randomLine = speechLines[Math.floor(Math.random() * speechLines.length)];
      bubble.textContent = randomLine;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(randomLine);
        msg.lang = 'zh-TW';
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
      }
    }

    // 每日星星簽到機制
    function checkDailyStar() {
      const lastDate = localStorage.getItem('pinyin_star_date');
      const today = new Date().toDateString();
      let stars = parseInt(localStorage.getItem('pinyin_stars') || '0');

      document.getElementById('star-count').textContent = `⭐ ${stars}`;

      if (lastDate === today) {
        const btn = document.getElementById('claim-btn');
        btn.textContent = '今日已領取';
        btn.disabled = true;
      }
    }

    function claimStar() {
      const today = new Date().toDateString();
      let stars = parseInt(localStorage.getItem('pinyin_stars') || '0');
      stars += 1;

      localStorage.setItem('pinyin_stars', stars);
      localStorage.setItem('pinyin_star_date', today);

      document.getElementById('star-count').textContent = `⭐ ${stars}`;
      const btn = document.getElementById('claim-btn');
      btn.textContent = '今日已領取';
      btn.disabled = true;

      alert('獲得 1 顆獎勵星星！好棒喔！⭐');
    }

    // 彈窗 Modal 控制
    function openModal(id) {
      if (id === 'rankModal') {
        renderLeaderboard();
      }
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    // 渲染排行榜
    function renderLeaderboard() {
      const rankContent = document.getElementById('rank-content');
      let scores = [];
      try {
        scores = JSON.parse(localStorage.getItem('pinyin_mole_leaderboard') || '[]');
      } catch (e) {
        scores = [];
      }

      if (scores.length === 0) {
        rankContent.innerHTML = `<p style="text-align:center; color:#a0aec0; padding:15px;">目前尚無成績記錄，快去挑戰遊戲吧！🎮</p>`;
        return;
      }

      let html = `<ol style="padding-left: 20px; line-height: 2;">`;
      scores.slice(0, 5).forEach((item, index) => {
        let badge = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '👤';
        html += `<li>${badge} <b>${item.className || '無班別'}</b> 班 <b>${item.studentId || '無學號'}</b> 號 — <span style="color:#e67e22; font-weight:900;">${item.score} 分</span></li>`;
      });
      html += `</ol>`;
      rankContent.innerHTML = html;
    }
  </script>
</body>
</html>
