<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拼音小高手 - 遊戲闖關大合集</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 600px;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      color: #0f172a;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 24px;
    }
    .game-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .game-card {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }
    .game-card:hover {
      border-color: #ea580c;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(234, 88, 12, 0.15);
    }
    .game-info {
      text-align: left;
    }
    .game-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .game-desc {
      font-size: 0.85rem;
      color: #64748b;
    }
    .play-btn {
      background: #ea580c;
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏀 拼音小高手 - 闖關大合集</h1>
    <p class="subtitle">請選擇你今天想要挑戰的拼音主題：</p>

    <div class="game-grid">
      <!-- 遊戲 1 -->
      <a href="game1.html" class="game-card">
        <div class="game-info">
          <div class="game-title">🎧 聽音辨單韻母大賽</div>
          <div class="game-desc">練習單韻母 (a, o, e, i, u, ü) 與四聲調辨識</div>
        </div>
        <div class="play-btn">開始遊戲</div>
      </a>

      <!-- 遊戲 2 -->
      <a href="game2.html" class="game-card">
        <div class="game-info">
          <div class="game-title">🎯 複韻母挑戰賽</div>
          <div class="game-desc">練習 ai, ei, ui, ao, ou, iu 等複韻母</div>
        </div>
        <div class="play-btn">開始遊戲</div>
      </a>

      <!-- 遊戲 3 -->
      <a href="game3.html" class="game-card">
        <div class="game-info">
          <div class="game-title">⭐ 聲母與整體認讀音節</div>
          <div class="game-desc">進階聲母辨識與整體認讀練習</div>
        </div>
        <div class="play-btn">開始遊戲</div>
      </a>
    </div>
  </div>

</body>
</html>
